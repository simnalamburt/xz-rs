[package]
name = "xz"
version = "0.4.6-rc.0"
authors = ["Alex Crichton <alex@alexcrichton.com>", "Portable-Network-Archive Developers"]
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["lzma", "xz", "encoding", "wasm"]
repository = "https://github.com/youknowone/xz-rs"
homepage = "https://github.com/youknowone/xz-rs"
description = """
Pure Rust xz library providing Read/Write streams as well as low-level
in-memory encoding/decoding. forked from xz2.
"""
categories = ["compression", "api-bindings"]
edition = "2021"
rust-version = "1.88"
exclude = [".github/"]

[workspace]
members = ["systest", "xz-core", "xz-sys", "perf-probe"]
exclude = ["fuzz"]

[dependencies]
xz-core = { path = "xz-core", version = "0.1.0-rc.0", optional = true }
xz-sys = { path = "xz-sys", version = "0.4.6-rc.0", optional = true }
liblzma-sys = { version = "0.4.6", optional = true, default-features = false }
num_cpus = { version = "1.16.0", optional = true }
criterion = { version = "0.5", features = ["html_reports"], optional = true }

[dev-dependencies]
rand = "0.8.0"
quickcheck = "=1.0.1"
regex = "=1.9.0"
log = "=0.4.20"
xz-core = { path = "xz-core" }

[[bench]]
name = "backend_comparison"
harness = false
required-features = ["bench"]

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
getrandom = { version = "0.2", features = ["js"] }

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = "0.3"

[features]
default = ["xz-core"]
xz-core = ["dep:xz-core"]
xz-sys = ["dep:xz-sys"]
# The xz crate uses lzma_index and LZMA_STREAM_HEADER_SIZE, which
# liblzma-sys only exposes from its bindgen-generated bindings.
liblzma-sys = ["dep:liblzma-sys", "liblzma-sys/bindgen"]
static = ["liblzma-sys?/static"]
parallel = ["xz-sys?/parallel", "liblzma-sys?/parallel", "num_cpus"]
bindgen = ["liblzma-sys?/bindgen"] # only affects liblzma-sys
wasm = ["xz-sys?/wasm", "liblzma-sys?/wasm"]
uncheck_liblzma_version = ["liblzma-sys?/uncheck_liblzma_version"] # only affects liblzma-sys
bench = ["criterion"]
# These two are for cross-language LTO with liblzma-sys.
fat-lto = ["liblzma-sys?/fat-lto"]
thin-lto = ["liblzma-sys?/thin-lto"]

[package.metadata.docs.rs]
features = ["parallel"]

[lints.rust]
unsafe_op_in_unsafe_fn = "allow"
