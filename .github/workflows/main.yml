name: CI
on: [push, pull_request]

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust: '1.88' # msrv
          - os: ubuntu-latest
            rust: stable
          - os: ubuntu-latest
            rust: stable
            static: yes
          - os: ubuntu-latest
            rust: beta
          - os: ubuntu-latest
            rust: nightly
          - os: macos-latest
            rust: stable
          - os: macos-latest
            rust: stable
            static: yes
          - os: windows-latest
            rust: stable-i686-msvc
          - os: windows-latest
            rust: stable-x86_64-msvc
          - os: windows-latest
            rust: stable-x86_64-msvc
            static: yes
          - os: windows-latest
            rust: stable-x86_64-msvc
            static: yes
            crt_static: yes
          - os: windows-latest
            rust: stable-i686-gnu
          - os: windows-latest
            rust: stable-x86_64-gnu
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
    - name: Install Rust (rustup)
      run: rustup update ${{ matrix.rust }} --no-self-update && rustup default ${{ matrix.rust }}
      shell: bash
    - uses: Swatinem/rust-cache@v2
      with:
        cache-targets: "false"
        save-if: ${{ github.event_name != 'pull_request' }}
    - name: Set crt-static
      if: matrix.crt_static == 'yes'
      run: echo RUSTFLAGS=-Ctarget-feature=+crt-static >> "$GITHUB_ENV"
      shell: bash
    - name: Set static
      if: matrix.static == 'yes'
      run: echo LZMA_API_STATIC=1 >> "$GITHUB_ENV"
      shell: bash
    - name: copy Cargo.lock for msrv check
      if: matrix.rust == '1.88'
      run: |
        cp Cargo.lock.msrv Cargo.lock
    - run: |
        cargo test
        cargo clean -p xz -p liblzma-sys
    - run: |
        cargo test -p xz-sys --features parallel
        cargo clean -p xz-sys -p liblzma-sys
    - run: |
        cargo test --features parallel
        cargo clean -p xz -p liblzma-sys
    - run: |
        cargo test --no-default-features --features xz-sys
        cargo clean -p xz -p xz-sys
    - run: |
        cargo test --no-default-features --features liblzma-sys
        cargo clean -p xz -p liblzma-sys
    # thin-lto and fat-lto feature required use clang as a linker, but linux default linker is gcc. so exclude thin-lto and fat-lto.
    - run: |
        cargo test --no-default-features --features liblzma-sys,parallel,static
        cargo clean -p xz -p liblzma-sys
      if: ${{ startsWith(matrix.os, 'ubuntu') }}
    - run: |
        cargo run --manifest-path systest/Cargo.toml --no-default-features --features xz-sys
        cargo clean -p xz-sys
      if: matrix.static == 'yes'


  rustfmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
    - name: Install Rust
      run: rustup update stable && rustup default stable && rustup component add rustfmt
    - run: cargo fmt -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
    - name: Install Rust
      run: rustup update stable && rustup default stable && rustup component add clippy
    # xz-core denies the soundness lints it used to hide behind `allow(clippy::all)`.
    # Both feature combinations are checked because some code is gated on
    # custom_allocator.
    - run: |
        cargo clippy -p xz-core --lib --all-targets
        cargo clippy -p xz-core --lib --all-targets --features custom_allocator
        cargo clippy -p xz-sys --lib --all-targets

  fuzz-smoke:
    name: Fuzz smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
    - name: Install Rust
      run: rustup update nightly --no-self-update && rustup default nightly
    - uses: Swatinem/rust-cache@v2
      with:
        cache-targets: "false"
        save-if: ${{ github.event_name != 'pull_request' }}
    - name: Install cargo-fuzz
      run: cargo install cargo-fuzz --version 0.13.1
    - name: Run fuzz smoke targets
      run: FUZZ_RUNS=4096 FUZZ_SANITIZER=address scripts/run_fuzz_smoke.sh

  upstream-c-tests:
    name: Upstream C xz tests with xz-sys
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
    - name: Install Rust
      run: rustup update stable --no-self-update && rustup default stable
    - uses: Swatinem/rust-cache@v2
      with:
        cache-targets: "false"
        save-if: ${{ github.event_name != 'pull_request' }}
    - name: Run upstream C xz test harness against xz-sys
      run: scripts/run_xz_c_tests_with_xz_sys.sh
